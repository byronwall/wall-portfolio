<script>
'use strict';
const $=id=>document.getElementById(id),rand=a=>a[Math.floor(random()*a.length)], levels=['Very low','Low','Medium','High','Very high'];
let W,H,mask,adj,route,stops,visible=false,seed=0,state=0,gates=[],code='';
// These numbers are part of printed puzzle codes. Keep them stable.
const modeIds={classic:0,pattern:1,quest:2,wind:4};
function modeOfCode(str){
 if(!/^MP-[0-9A-Z]{10}$/.test(str))return;
 const id=Math.floor(parseInt(str.slice(3,7),36)/(19*5*5*3*3*5));
 return Object.keys(modeIds).find(mode=>modeIds[mode]===id);
}
function random(){state=(Math.imul(state,1664525)+1013904223)>>>0;return state/4294967296}
function encode(){let bits=modeIds[$('mode').value];for(let [base,val] of [[19,(W-12)/2],[5,+$('complex').value],[5,+$('ends').value],[3,$('diff').selectedIndex],[3,$('pattern').selectedIndex],[5,+$('chests').value-1]])bits=bits*base+val;return 'MP-'+bits.toString(36).padStart(4,'0').toUpperCase()+seed.toString(36).padStart(6,'0').toUpperCase()}
function restore(str){str=str.trim().toUpperCase();const mode=modeOfCode(str);if(!mode)return false;let bits=parseInt(str.slice(3,7),36);function take(n){let v=bits%n;bits=Math.floor(bits/n);return v}
$('chests').value=take(5)+1;$('pattern').selectedIndex=take(3);$('diff').selectedIndex=take(3);$('ends').value=take(5);$('complex').value=take(5);$('size').value=take(19)*2+12;$('mode').value=mode;generate(parseInt(str.slice(7),36));return true}
function near(i){return [i%W?i-1:-1,i%W<W-1?i+1:-1,i-W,i+W].filter(j=>j>=0&&j<W*H&&!mask[j])}
function path(g,a,b){let prev=new Int32Array(g.length).fill(-1),q=[a];prev[a]=a;for(let k=0;k<q.length&&prev[b]<0;k++)for(let j of g[q[k]])if(prev[j]<0){prev[j]=q[k];q.push(j)}if(prev[b]<0)throw Error('Disconnected maze');let p=[b];while(p.at(-1)!==a)p.push(prev[p.at(-1)]);return p.reverse()}
function carve(){let n=W*H,g=Array.from({length:n},()=>[]),seen=new Uint8Array(n),stack=[0];seen[0]=1;function link(a,b){g[a].push(b);g[b].push(a)}
while(stack.length){let a=stack.at(-1),opts=near(a).filter(j=>!seen[j]);if(!opts.length){stack.pop();continue}let d=a-stack.at(-2),straight=opts.find(j=>j-a===d),turn=opts.filter(j=>j-a!==d),c=+$('complex').value;
let b=straight!==undefined&&random()<(4-c)*.24?straight:turn.length&&random()<c*.23?rand(turn):rand(opts);link(a,b);seen[b]=1;stack.push(b)}
let leaves=g.map((v,i)=>v.length===1&&i!==0&&i!==n-1?i:-1).filter(i=>i>=0);
for(let k=leaves.length-1;k>0;k--){let j=Math.floor(random()*(k+1));[leaves[k],leaves[j]]=[leaves[j],leaves[k]]}
for(let i of leaves){if(g[i].length!==1||random()<+$('ends').value/4)continue;let opts=near(i).filter(j=>!g[i].includes(j));if(opts.length)link(i,rand(opts))}
return {g,p:path(g,0,n-1)}}
function generate(requested){seed=typeof requested==='number'?requested:crypto.getRandomValues(new Uint32Array(1))[0]%(36**6);state=seed;W=+$('size').value;H=Math.round(W*.64);let n=W*H,mode=$('mode').value,pattern=$('pattern').selectedIndex;
mask=Array.from({length:n},(_,i)=>{let x=i%W,y=Math.floor(i/W);if(mode!=='pattern'||x<2||x>=W-2||y<2||y>=H-2)return false;return pattern===0?Math.abs(x%8-4)+Math.abs(y%8-4)<=2:pattern===1?(x+(Math.floor(y/5)%2)*3)%7<3&&y%5<2:x%6>=2&&x%6<=3&&y%7>=2&&y%7<=5});
let picks=Array.from({length:9},carve).sort((a,b)=>a.p.length-b.p.length),pick=picks[$('diff').selectedIndex*4];adj=pick.g;route=pick.p;stops=[];
if(mode==='quest'){// Keep chest goals off both endpoints; avoid crossing a later goal on an earlier leg.
let candidates=adj.flatMap((v,i)=>v.length&&i&&i!==n-1?[i]:[]);for(let k=0;k<+$('chests').value;k++){let j=Math.floor(random()*candidates.length);stops.push(candidates.splice(j,1)[0])}
let remaining=new Set(stops),here=0;route=[0];stops=[];while(remaining.size){let p=[...remaining].map(t=>path(adj,here,t)).sort((a,b)=>a.length-b.length)[0];here=p.at(-1);remaining.delete(here);stops.push(here);route.push(...p.slice(1))}route.push(...path(adj,here,n-1).slice(1))}

let gap=Math.max(4,Math.floor(route.length/6));for(let i=2;i<route.length-2;i+=gap)gates.push([route[i],route[i+1]]);for(let a=0;a<n;a++)if(!route.includes(a)&&random()<.016){let b=adj[a].find(v=>dist[v]<dist[a]);if(b!==undefined)gates.push([a,b])}}

   // A pointer aimed straight through a fork may approach it, but never cross it.
   let dx=cell%W-prev%W,dy=Math.floor(cell/W)-Math.floor(prev/W),tx=targetCell%W-cell%W,ty=Math.floor(targetCell/W)-Math.floor(cell/W);
   if(onward.length>1&&tx*dy===ty*dx&&tx*dx+ty*dy>0&&segment.length+Math.abs(tx)+Math.abs(ty)<=5){let offset=dx+dy*W,cursor=cell;while(cursor!==targetCell&&edges(cursor).includes(cursor+offset))cursor+=offset;if(cursor===targetCell)stopsAtFork.push(segment.slice())}
   break
  }
  if(!edges(cell).includes(onward[0]))break;
  prev=cell;cell=onward[0];
 }
}
return hits.length===1?hits[0]:!hits.length&&stopsAtFork.length===1?stopsAtFork[0]:[]}
let hoverTarget=-1,contact=null;
const board=$('board');
function cellAt(e){const svg=board.firstElementChild,p=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse()),x=Math.floor(p.x/20),y=Math.floor(p.y/20);return x<0||y<0||x>=W||y>=H?-1:y*W+x}
board.addEventListener('pointerdown',e=>{if(!run||run.done||e.pointerType==='mouse'||!e.isPrimary)return;let b=cellAt(e);if(b<0)return;contact=e.pointerId;board.setPointerCapture(contact);hoverTarget=b;if(b!==run.pos&&edges(run.pos).includes(b))move(b)});
for(let type of ['pointerup','pointercancel','lostpointercapture'])board.addEventListener(type,e=>{if(e.pointerId===contact){contact=null;hoverTarget=-1}});
for(let [button,id] of [['settings','workshop'],['paper','printbox']])$(button).onclick=()=>$(id).showModal();
$('settingsDone').onclick=()=>$('workshop').close();
$('show').onclick=()=>{toggle(!visible);$('printbox').close()};
$('print').onclick=()=>{$('printbox').close();printSheet(false)};
$('answer').onclick=()=>{$('printbox').close();printSheet(true)};
$('board').addEventListener('pointerleave',()=>hoverTarget=-1);
$('board').addEventListener('pointermove',e=>{if(!run||run.done||(e.pointerType!=='mouse'&&e.pointerId!==contact)||e.buttons>1)return;
 let svg=$('board').firstElementChild,q=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse()),x=Math.floor(q.x/20),y=Math.floor(q.y/20);
 if(x<0||x>=W||y<0||y>=H)return;
 let b=y*W+x;if(b===hoverTarget)return;hoverTarget=b;
 let segment=strokeTo(b,run.pos);for(let v of segment){move(v);if(run.done)break}
 if(segment.length&&!run.done&&adj[run.pos].length>2&&!stops.includes(run.pos))$('status').textContent='Fork! Pick the next square.';
});

function setFullView(on){
 document.body.classList.toggle('fullView',on);
 $('fullView').textContent=on?'Exit full view':'Full view';
 $('fullView').setAttribute('aria-pressed',String(on));
}
$('fullView').onclick=()=>setFullView(!document.body.classList.contains('fullView'));
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'&&!document.querySelector('dialog[open]'))setFullView(false);
});
$('reset').onclick=()=>{ $('restart').returnValue='cancel';$('restart').showModal() };
$('restart').addEventListener('close',()=>{
 if($('restart').returnValue!=='reset'||!run)return;
 const help=run.help;
 run={pos:0,moves:0,chests:0,trail:[0],done:false,help};
 hoverTarget=-1;contact=null;toggle(false);paint();save();
 $('status').textContent='Back at the start.';
 $('board').focus({preventScroll:true});
});
if(!restore(location.hash.slice(1)))generate();
</script></html>
