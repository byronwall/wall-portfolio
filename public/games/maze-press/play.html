<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Maze Press · Puzzle workshop</title>
<style>
:root{--ink:#183f35;--paper:#fffef6;--line:#c7ccbc;--red:#a8432d;font:15px/1.45 system-ui,sans-serif;color:var(--ink);background:#e9ecdf}*{box-sizing:border-box}body{margin:0}header{background:var(--ink);color:#fffbea;padding:16px max(4vw,20px);display:flex;align-items:center;gap:12px}header strong{font: bold 25px Georgia}header small{margin-left:auto;color:#e2e6d6}.mono,small,.eyebrow,output,.folio{font:600 11px/1.5 ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase}main{max-width:1340px;margin:32px auto;padding:0 3vw}.intro,.sheethead,.actions,.legend,.row{display:flex;align-items:center;gap:10px}.intro{justify-content:space-between;margin-bottom:22px}h1,h2,p{margin:0}h1,h2{font-family:Georgia,serif}h1{font-size:clamp(32px,4vw,52px);letter-spacing:-.045em;line-height:1.12}.intro p,.sheethead p,.hint{color:#52665a}.intro p{margin-top:6px}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start}aside,.sheet{border:1px solid var(--line);border-radius:6px;background:#f4f5ea}aside{padding:22px}h2{font-size:24px;letter-spacing:-.035em}button,select{font:inherit;color:inherit;cursor:pointer}button,select{border:1px solid #a8b5a5;background:#fafbf2;border-radius:5px;padding:9px 12px}button:hover,select:hover{background:#e0e7d5}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ba5935;outline-offset:2px}.primary{background:var(--ink);color:white;border-color:var(--ink);font-weight:650}.primary:hover{background:#2c5949}label{display:block;font-size:13px;font-weight:650}.control{margin-top:17px}.row{justify-content:space-between}output{font-size:10px;color:#52665a}select{width:100%;margin-top:5px}input[type=range]{accent-color:var(--ink);width:100%;margin:9px 0 0;cursor:pointer}.hint{font-size:12px;margin-top:6px}.rule{border:0;border-top:1px solid var(--line);margin:18px 0}.sheet{background:var(--paper);padding:clamp(16px,2.7vw,40px);box-shadow:0 4px 0 #dce0d0}.sheethead{justify-content:space-between;margin:8px 0 16px}.eyebrow,.folio{color:var(--red)}.sheethead h2{font-size:clamp(28px,3.2vw,48px);line-height:1.2}.sheethead p{font-size:14px}.stamp{width:54px;height:54px;flex:none}.map{width:100%;height:auto;display:block}.legend{flex-wrap:wrap;gap:15px;font-size:12px;border-top:1px solid var(--line);padding-top:12px}.legend b{color:var(--red)}.actions{flex-wrap:wrap;margin-top:18px}.actions button{font-size:13px;font-weight:650}.actions button:first-child{margin-right:auto}.stats{margin-top:12px;font:11px ui-monospace,monospace;color:#596859}.printtitle{display:none}.solution{display:none}.revealed .solution{display:block}[hidden]{display:none!important}
@media(max-width:800px){main{margin-top:20px}.layout{grid-template-columns:218px minmax(0,1fr);gap:12px}aside{padding:15px}.stamp{display:none}}@media(max-width:650px){.layout{display:flex;flex-direction:column}.preview,aside{width:100%}.preview{order:-1}.intro{align-items:flex-start}.primary{font-size:13px;white-space:nowrap}header small{font-size:9px}.actions button:first-child{margin-right:0}}
@page{size:auto;margin:12mm}@media print{html,body,main,.sheet{margin:0;padding:0;background:white;color:black}.layout,.preview{display:block}header,.intro,aside,.actions,.stats,.stamp{display:none}.sheet{border:0;box-shadow:none;break-inside:avoid}.sheethead h2{font-size:26pt}.printtitle{display:inline}.folio,.eyebrow,.legend b,.sheethead p{color:black}.solution,.revealed .solution{display:none!important}body.key .solution{display:block!important}.map{max-height:67vh}.legend{color:black}.sheethead{margin:3mm 0}.map .wall{stroke:black}.map .route{stroke:#444;stroke-dasharray:3 2}.map .marker{fill:#111}}
@media screen{header{padding:10px max(3vw,18px);gap:10px}header h1{font:bold 26px Georgia;letter-spacing:-.04em;white-space:nowrap}header small{margin-left:8px;color:#d6e2d4}header button{margin-left:auto;color:#fff;background:transparent;border-color:#77978c;padding:6px 12px}header button:hover{background:#31594c}main{margin:20px auto}.layout{gap:26px}.actions{margin:0 0 12px;gap:7px}.actions button{min-height:36px}.actions button:first-child{min-width:112px}.sheet{padding:clamp(15px,2vw,30px);box-shadow:0 2px 0 #d6dacd}.sheethead{margin:4px 0 12px}.sheethead h2{font-size:clamp(27px,2.6vw,40px)}.map{max-height:61vh}.stats{line-height:1.6}aside{border:0;border-radius:0;padding:0 20px 0 0;background:none;border-right:1px solid var(--line)}input[type=range]{min-height:24px;margin:3px 0 0}.control{margin-top:13px}#loadForm{display:flex;gap:5px;margin-top:5px}#code{font:13px ui-monospace,monospace;width:100%;min-width:0;border:1px solid #a8b5a5;border-radius:4px;padding:6px 8px;background:#fafbf2;color:var(--ink);text-transform:uppercase}#loadForm button{font-size:13px;padding:6px 9px}@media(max-width:650px){header small{display:none}.layout{gap:16px}.actions button{padding:7px 9px}.actions button:first-child{margin-right:auto;min-width:0}aside{border:0;padding:0 6px;width:100%}main{margin-top:12px}}}
.actions #play{margin-right:0;min-width:0}.actions #show{margin-left:auto}#console{padding:10px 0}.playrow,#pad,#shelf form{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.playrow+.playrow{margin:8px 0}.playrow select{width:auto;margin:0}.playrow button,.playrow select{padding:6px 9px;font-size:13px}#pad button{width:38px;height:36px;font-size:17px}#savestate{font-size:10px;color:#52665a}#status{font-size:13px}#shelf{color:var(--ink);border:1px solid var(--line);border-radius:8px;max-height:75vh;width:min(450px,90vw);background:var(--paper)}#shelf::backdrop{background:#12382d66}#shelf form{justify-content:space-between}#list button{display:block;width:100%;text-align:left;margin-top:8px;font-size:13px}#dot{transition:transform 95ms ease-out}button{transition:background-color 120ms}button:disabled{opacity:.55;cursor:default}@media(prefers-reduced-motion:reduce){*,*::after{transition:none!important}}@media screen and (max-width:650px){.actions{gap:4px}.actions button{font-size:12px;padding:5px 8px}.actions #show{margin-left:0}}@media print{#console,#shelf,.player-layer{display:none!important}}

<header><svg width="31" height="31" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.7" aria-hidden="true"><path d="M13 3H3v26h26V3H18v18H11V10H8v14h15V8"/></svg><h1>Maze Press</h1><small>Puzzle workshop</small><button id="new">↻ New maze</button></header>
<main><div class="layout"><aside><h2>Workshop</h2><div class="control"><label for="mode">Maze mode</label><select id="mode"><option value="classic">Classic corridors</option><option value="pattern">Pattern islands</option><option value="quest">Treasure hunt</option><option value="tunnel">Rabbit burrow</option><option value="wind">Windy Ridge</option></select></div>
<div class="control" id="patternBox" hidden><label for="pattern">Island pattern</label><select id="pattern"><option>Diamonds</option><option>Stepping stones</option><option>Pillars</option></select></div>
<div class="control" id="chestBox" hidden><div class="row"><label for="chests">Treasure chests</label><output for="chests" id="chestsVal"></output></div><input type="range" id="chests" min="1" max="5" value="3"></div><hr class="rule">
<div class="control"><div class="row"><label for="size">Grid size</label><output id="sizeVal" for="size"></output></div><input type="range" id="size" min="12" max="48" step="2" value="26"></div>
<div class="control"><div class="row"><label for="complex">Path complexity</label><output id="complexVal" for="complex"></output></div><input type="range" id="complex" min="0" max="4" value="2"></div>
<div class="control"><div class="row"><label for="ends">Dead ends</label><output id="endsVal" for="ends"></output></div><input type="range" id="ends" min="0" max="4" value="3"></div>
<div class="control"><label for="diff">Difficulty</label><select id="diff"><option>Easy</option><option selected>Standard</option><option>Hard</option></select><p class="hint">Harder puzzles favor longer routes.</p></div><hr class="rule"><label for="code">Puzzle code</label><form id="loadForm"><input id="code" autocomplete="off" spellcheck="false" maxlength="18" required pattern="MP-[0-9A-Z]{10}" title="Use MP- followed by ten letters or digits"><button>Load</button></form><p class="hint">Enter a sheet’s code to play it again.</p></aside>
<section class="preview"><div class="actions"><button class="primary" id="play">Play maze</button><button id="library">Saved mazes</button><button id="show" aria-pressed="false">Show solution</button><button class="primary" id="print">Print maze</button><button id="answer">Print solution</button></div><article class="sheet"><div class="folio" id="folio"></div><div class="sheethead"><div><h2 id="name"></h2><p id="mission"></p><strong class="printtitle" id="printtitle"></strong></div><svg class="stamp" viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="26" fill="none" stroke="#a7ac88" stroke-dasharray="2 3"/><path d="m30 5 4 21 16 4-16 4-4 21-4-21-16-4 16-4z" fill="#b9c4a1"/><path d="m30 9 0 21-4-4zM30 30l4 4-4 18z" fill="#214b3d"/></svg></div><div id="board"></div><div class="legend"><span><b>▶</b> Start</span><span><b>⚑</b> Finish</span><span id="extra"></span></div></article>
<div id="console" hidden><div class="playrow"><label for="assist">Trail guide</label><select id="assist"><option value="guided">Guided · warn on wrong turns</option><option value="hint">Explorer · ask for a hint</option><option value="solo">Solo · no hints</option></select><button id="hint">Hint</button><button id="hop" hidden>Hop</button></div><div class="playrow"><div id="pad" aria-label="Move"><button aria-label="Move up" data-d="0">↑</button><button aria-label="Move left" data-d="1">←</button><button aria-label="Move down" data-d="2">↓</button><button aria-label="Move right" data-d="3">→</button></div><span id="status" role="status"></span></div><small id="savestate"></small></div>
<dialog id="shelf"><form method="dialog"><h2>Saved mazes</h2><button aria-label="Close saved mazes">Close</button></form><p class="hint">Attempts saved in this browser.</p><div id="list"></div></dialog><div class="stats" aria-live="polite" id="stats"></div></section></div></main>
<script>
'use strict';
const $=id=>document.getElementById(id),rand=a=>a[Math.floor(random()*a.length)], levels=['Very low','Low','Medium','High','Very high'];
let W,H,mask,adj,route,stops,visible=false,seed=0,state=0,holes=[],gates=[],code='';
const modes=['classic','pattern','quest','tunnel','wind'];
function random(){state=(Math.imul(state,1664525)+1013904223)>>>0;return state/4294967296}
function encode(){let bits=modes.indexOf($('mode').value);for(let [base,val] of [[19,(W-12)/2],[5,+$('complex').value],[5,+$('ends').value],[3,$('diff').selectedIndex],[3,$('pattern').selectedIndex],[5,+$('chests').value-1]])bits=bits*base+val;return 'MP-'+bits.toString(36).padStart(4,'0').toUpperCase()+seed.toString(36).padStart(6,'0').toUpperCase()}
function restore(str){str=str.trim().toUpperCase();if(!/^MP-[0-9A-Z]{10}$/.test(str))return false;let bits=parseInt(str.slice(3,7),36);if(bits>=5*19*5*5*3*3*5)return false;function take(n){let v=bits%n;bits=Math.floor(bits/n);return v}
$('chests').value=take(5)+1;$('pattern').selectedIndex=take(3);$('diff').selectedIndex=take(3);$('ends').value=take(5);$('complex').value=take(5);$('size').value=take(19)*2+12;$('mode').value=modes[bits];generate(parseInt(str.slice(7),36));return true}
function near(i){return [i%W?i-1:-1,i%W<W-1?i+1:-1,i-W,i+W].filter(j=>j>=0&&j<W*H&&!mask[j]&&(!holes.length||(i%W<W/2)===(j%W<W/2)))}
function path(g,a,b){let prev=new Int32Array(g.length).fill(-1),q=[a];prev[a]=a;for(let k=0;k<q.length&&prev[b]<0;k++)for(let j of g[q[k]])if(prev[j]<0){prev[j]=q[k];q.push(j)}if(prev[b]<0)throw Error('Disconnected maze');let p=[b];while(p.at(-1)!==a)p.push(prev[p.at(-1)]);return p.reverse()}
function carve(){let n=W*H,g=Array.from({length:n},()=>[]),seen=new Uint8Array(n),stack=[0];seen[0]=1;if(holes.length){stack.unshift(W-1);seen[W-1]=1}function link(a,b){g[a].push(b);g[b].push(a)}
while(stack.length){let a=stack.at(-1),opts=near(a).filter(j=>!seen[j]);if(!opts.length){stack.pop();continue}let d=a-stack.at(-2),straight=opts.find(j=>j-a===d),turn=opts.filter(j=>j-a!==d),c=+$('complex').value;
let b=straight!==undefined&&random()<(4-c)*.24?straight:turn.length&&random()<c*.23?rand(turn):rand(opts);link(a,b);seen[b]=1;stack.push(b)}
let leaves=g.map((v,i)=>v.length===1&&i!==0&&i!==n-1?i:-1).filter(i=>i>=0);
for(let k=leaves.length-1;k>0;k--){let j=Math.floor(random()*(k+1));[leaves[k],leaves[j]]=[leaves[j],leaves[k]]}
for(let i of leaves){if(g[i].length!==1||random()<+$('ends').value/4)continue;let opts=near(i).filter(j=>!g[i].includes(j));if(opts.length)link(i,rand(opts))}
if(holes.length)link(...holes);
return {g,p:path(g,0,n-1)}}
function generate(requested){seed=typeof requested==='number'?requested:crypto.getRandomValues(new Uint32Array(1))[0]%(36**6);state=seed;W=+$('size').value;H=Math.round(W*.64);let n=W*H,mode=$('mode').value,pattern=$('pattern').selectedIndex;
holes=mode==='tunnel'?[W*(1+Math.floor(random()*(H-2)))+1+Math.floor(random()*(W/2-2)),W*(1+Math.floor(random()*(H-2)))+W/2+1+Math.floor(random()*(W/2-2))]:[];
mask=Array.from({length:n},(_,i)=>{let x=i%W,y=Math.floor(i/W);if(mode!=='pattern'||x<2||x>=W-2||y<2||y>=H-2)return false;return pattern===0?Math.abs(x%8-4)+Math.abs(y%8-4)<=2:pattern===1?(x+(Math.floor(y/5)%2)*3)%7<3&&y%5<2:x%6>=2&&x%6<=3&&y%7>=2&&y%7<=5});
let picks=Array.from({length:9},carve).sort((a,b)=>a.p.length-b.p.length),pick=picks[$('diff').selectedIndex*4];adj=pick.g;route=pick.p;stops=[];
if(mode==='quest'){// Keep chest goals off both endpoints; avoid crossing a later goal on an earlier leg.
let candidates=adj.flatMap((v,i)=>v.length&&i&&i!==n-1?[i]:[]);for(let k=0;k<+$('chests').value;k++){let j=Math.floor(random()*candidates.length);stops.push(candidates.splice(j,1)[0])}
let remaining=new Set(stops),here=0;route=[0];stops=[];while(remaining.size){let p=[...remaining].map(t=>path(adj,here,t)).sort((a,b)=>a.length-b.length)[0];here=p.at(-1);remaining.delete(here);stops.push(here);route.push(...p.slice(1))}route.push(...path(adj,here,n-1).slice(1))}
gates=[];if(mode==='wind'){let dist=new Int32Array(n).fill(-1),q=[n-1];dist[n-1]=0;for(let i=0;i<q.length;i++)for(let j of adj[q[i]])if(dist[j]<0){dist[j]=dist[q[i]]+1;q.push(j)}
let gap=Math.max(4,Math.floor(route.length/6));for(let i=2;i<route.length-2;i+=gap)gates.push([route[i],route[i+1]]);for(let a=0;a<n;a++)if(!route.includes(a)&&random()<.016){let b=adj[a].find(v=>dist[v]<dist[a]);if(b!==undefined)gates.push([a,b])}}
code=encode();$('code').value=code;try{history.replaceState(null,'','#'+code)}catch{}visible=false;$('patternBox').hidden=mode!=='pattern';$('chestBox').hidden=mode!=='quest';$('sizeVal').value=W+' × '+H;$('complexVal').value=levels[$('complex').value];$('endsVal').value=levels[$('ends').value];$('chestsVal').value=$('chests').value;
$('name').textContent={classic:'The winding paths',pattern:'The island passage',quest:'The treasure trail',tunnel:'Rabbit burrow',wind:'Windy Ridge'}[mode];$('folio').textContent='FIELD SHEET / '+code+'  ·  '+$('diff').value;$('mission').textContent=mode==='wind'?'Follow the wind at each arrow. Other passages go both ways.':mode==='tunnel'?'Find a rabbit hole, hop to its twin, then trace your way to the flag.':mode==='quest'?'Visit the numbered chests in order, then reach the flag.':mode==='pattern'?'Find a path around the shaded islands to the flag.':'Trace a path from the arrow to the flag.';$('extra').textContent=mode==='wind'?'➜  One-way wind gate':mode==='tunnel'?'◎  Twin rabbit holes':mode==='pattern'?'▨  Blocked island':mode==='quest'?'▣  Numbered chest':'';$('stats').textContent=W+' × '+H+' cells · '+adj.filter((v,i)=>v.length===1&&i!==0&&i!==n-1).length+' dead ends · '+route.slice(1).length+' solution steps';draw();toggle(false);leavePlay()}
function draw(){const s=20,X=i=>(i%W)*s,Y=i=>Math.floor(i/W)*s;let walls='',blocks='';
for(let i=0;i<W*H;i++){let x=X(i),y=Y(i);if(mask[i]){blocks+='M'+x+' '+y+'h20v20h-20z';continue}let v=adj[i];if(!v.includes(i-W))walls+='M'+x+' '+y+'h20';if(i!==0&&(x===0||!v.includes(i-1)))walls+='M'+x+' '+y+'v20';if(i!==W*H-1&&(x===(W-1)*s||mask[i+1]))walls+='M'+(x+s)+' '+y+'v20';if(y===(H-1)*s||mask[i+W])walls+='M'+x+' '+(y+s)+'h20'}
let endX=W*s,endY=H*s-10;
$('board').innerHTML='<svg class="map" role="img" aria-label="Maze with a start on the upper left and a finish on the lower right" viewBox="-18 -6 '+(endX+38)+' '+(H*s+18)+'"><defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M-1 1l2-2M0 5l5-5M4 6l2-2" stroke="#7d8779" stroke-width="1.4"/></pattern></defs><path d="'+blocks+'" fill="url(#hatch)"/><path class="wall" d="'+walls+'" fill="none" stroke="#254638" stroke-width="1.9" stroke-linecap="square"/><path class="solution route" d="M-5 10 '+route.map((i,k)=>(k&&holes.includes(i)&&holes.includes(route[k-1])?'M':'L')+(X(i)+10)+' '+(Y(i)+10)).join(' ')+' L'+(endX+4)+' '+endY+'" fill="none" stroke="#bd5638" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><g class="marker" fill="#a8432d"><path d="M-15 3l12 7-12 7z"/><path transform="translate('+(endX+6)+' '+(endY-7)+')" d="M0 0h12l-3 4 3 4H2v8H0z"/></g>'+stops.map((i,k)=>'<g transform="translate('+X(i)+' '+Y(i)+')"><rect x="2" y="3" width="16" height="14" rx="3" fill="#fff5cc" stroke="#493d21" stroke-width="1.4"/><path d="M2 8h16" stroke="#493d21"/><rect x="6" y="4" width="8" height="12" fill="#fff5cc"/><text x="10" y="14" text-anchor="middle" font-size="11" font-weight="bold">'+(k+1)+'</text></g>').join('')+gates.map(([a,b])=>'<g transform="translate('+((X(a)+X(b))/2+10)+' '+((Y(a)+Y(b))/2+10)+') rotate('+(b===a+1?0:b===a-1?180:b>a?90:-90)+')"><path d="M-5 0h9M0-4l4 4-4 4" fill="none" stroke="#914321" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></g>').join('')+holes.map(i=>'<g transform="translate('+X(i)+' '+Y(i)+')" fill="#faf6de" stroke="#483e2a" stroke-width="1.5"><ellipse cx="10" cy="13" rx="8" ry="5"/><ellipse cx="8" cy="8" rx="1.7" ry="4.4" transform="rotate(-13 8 8)"/><ellipse cx="12" cy="8" rx="1.7" ry="4.4" transform="rotate(13 12 8)"/></g>').join('')+'</svg>'}
function toggle(v){visible=v;$('board').classList.toggle('revealed',v);$('show').textContent=v?'Hide solution':'Show solution';$('show').setAttribute('aria-pressed',String(v))}
function printSheet(key){document.body.classList.toggle('key',key);$('printtitle').textContent=key?'Answer key':'Puzzle';window.print()}
window.addEventListener('afterprint',()=>{document.body.classList.remove('key');$('printtitle').textContent='Puzzle'});
$('printtitle').textContent='Puzzle';$('new').onclick=generate;$('show').onclick=()=>toggle(!visible);$('print').onclick=()=>printSheet(false);$('answer').onclick=()=>printSheet(true);document.querySelector('aside').onchange=e=>{if(e.target.id!=='code')generate()};$('code').oninput=e=>{e.target.value=e.target.value.toUpperCase();e.target.setCustomValidity('')};$('loadForm').onsubmit=e=>{e.preventDefault();if(!restore($('code').value)){$('code').setCustomValidity('Check the code printed on your sheet.');$('code').reportValidity()}};
for(let [id,fmt] of [['size',v=>v+' × '+Math.round(v*.64)],['complex',v=>levels[v]],['ends',v=>levels[v]],['chests',v=>v]])$(id).oninput=()=>$(id+'Val').value=fmt($(id).value);
const storeKey='maze-press:attempts:v1';
let run=null,saves={},canSave=true;
try{saves=JSON.parse(localStorage.getItem(storeKey)||'{}')||{}}catch{canSave=false}
function save(){saves[code]={...run,time:Date.now(),title:$('name').textContent,diff:$('diff').value};try{localStorage.setItem(storeKey,JSON.stringify(saves));canSave=true}catch{canSave=false}
$('savestate').textContent=(canSave?'Saved in this browser':'Storage unavailable · this session only')+' · '+run.moves+(run.moves===1?' move':' moves')+(stops.length?' · '+run.chests+'/'+stops.length+' chests':'')}
function leavePlay(){run=null;$('console').hidden=true;$('play').textContent='Play maze';$('board').querySelector('.player-layer')?.remove()}
function edges(a){return adj[a].filter(b=>!gates.some(g=>g[1]===a&&g[0]===b))}
function target(){return stops[run.chests]??W*H-1}
function distance(goal){let d=new Int32Array(W*H).fill(-1),q=[goal];d[goal]=0;for(let i=0;i<q.length;i++)for(let b of adj[q[i]])if(d[b]<0&&edges(b).includes(q[i])){d[b]=d[q[i]]+1;q.push(b)}return d}
const pt=i=>[(i%W)*20+10,Math.floor(i/W)*20+10];
function paint(){let root=$('board').firstElementChild,layer=root.querySelector('.player-layer');if(!layer){layer=document.createElementNS(root.namespaceURI,'g');layer.setAttribute('class','player-layer');layer.innerHTML='<path id="trail" fill="none" stroke="#3a847a" stroke-opacity=".56" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g id="dot"><circle r="6" fill="#106e63" stroke="white" stroke-width="2"/><circle r="1.8" fill="white"/></g>';root.append(layer)}
$('trail').setAttribute('d',run.trail.map((v,k)=>((!k||(holes.includes(v)&&holes.includes(run.trail[k-1])))?'M':'L')+pt(v).join(' ')).join(' '));let [x,y]=pt(run.pos);$('dot').style.transform='translate('+x+'px,'+y+'px)';$('hop').hidden=!holes.includes(run.pos)||run.done;$('hint').disabled=run.done||run.help==='solo';$('pad').querySelectorAll('button').forEach(b=>b.disabled=run.done)}
function start(){hoverTarget=-1;toggle(false);let previous=saves[code];run=previous?{...previous,trail:[...previous.trail]}:{pos:0,moves:0,chests:0,trail:[0],done:false,help:'guided'};$('assist').value=run.help;$('console').hidden=false;$('play').textContent='Leave play';$('status').textContent=run.done?'Maze complete!':previous?'Resumed your trail.':'Hover along a passage, tap a nearby cell, or use the arrow keys.';paint();save();$('board').tabIndex=0;$('board').focus({preventScroll:true})}
function move(b){if(!run||run.done)return;let a=run.pos;if(!edges(a).includes(b)){$('status').textContent=adj[a].includes(b)?'The wind blows the other way.':'There is a wall there.';return}
let goal=target(),d=run.help==='guided'?distance(goal):null;run.pos=b;run.moves++;let back=run.trail.indexOf(b);if(back>=0)run.trail.length=back+1;else run.trail.push(b);
let msg='Keep exploring.';if(d&&d[b]>d[a])msg='That leads away from your goal. Try another passage.';if(stops[run.chests]===b){run.chests++;msg='Chest '+run.chests+' found!'}if(holes.includes(b)&&!holes.includes(a))msg='Rabbit hole! Choose Hop to cross.';if(b===W*H-1){run.done=run.chests===stops.length;msg=run.done?'Maze complete! You reached the flag in '+run.moves+' moves.':'Find chest '+(run.chests+1)+' before finishing.'}
$('status').textContent=msg;paint();save()}
function step(k){if(!run)return;let a=run.pos, b=a+[-W,-1,W,1][k];if(holes.includes(a)&&holes.includes(b))return;move(b)}
$('play').onclick=()=>run?leavePlay():start();$('assist').onchange=()=>{run.help=$('assist').value;$('status').textContent=run.help==='guided'?'Wrong-turn guidance is on.':run.help==='hint'?'Ask for a hint when you want one.':'Hints are off.';paint();save()};
$('hop').onclick=()=>{if(run&&holes.includes(run.pos))move(holes.find(i=>i!==run.pos))};
$('hint').onclick=()=>{if(!run||run.done||run.help==='solo')return;let d=distance(target()),b=edges(run.pos).find(i=>d[i]===d[run.pos]-1),delta=b-run.pos;$('status').textContent=holes.includes(b)&&holes.includes(run.pos)?'Hop through the burrow.':'Try one step '+({[-W]:'up',[-1]:'left',[W]:'down',[1]:'right'}[delta])+'.'};
$('pad').onclick=e=>{if(e.target.dataset.d!==undefined)step(+e.target.dataset.d)};document.addEventListener('keydown',e=>{if(!run||$('shelf').open||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.altKey||e.ctrlKey||e.metaKey)return;let k=['ArrowUp','ArrowLeft','ArrowDown','ArrowRight'].indexOf(e.key);if(k>=0){e.preventDefault();step(k)}});
$('board').onclick=e=>{if(!run)return;let svg=$('board').firstElementChild,q=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse()),x=Math.floor(q.x/20),y=Math.floor(q.y/20),b=y*W+x;if(x<0||x>=W||y<0||y>=H)return;if(b===run.pos&&holes.includes(b))$('hop').click();else if(Math.abs(x-run.pos%W)+Math.abs(y-Math.floor(run.pos/W))===1)move(b)};
$('library').onclick=()=>{let list=$('list');list.replaceChildren();let entries=Object.entries(saves).sort((a,b)=>b[1].time-a[1].time);if(!entries.length)list.textContent='No attempts yet. Choose Play maze to start one.';for(let [key,item] of entries){let button=document.createElement('button');button.textContent=item.title+' · '+item.diff+' · '+(item.done?'Complete':item.moves+' moves')+' · '+new Date(item.time).toLocaleDateString()+' · '+key;button.onclick=()=>{if(restore(key)){start();$('shelf').close()}};list.append(button)}$('shelf').showModal()};

// Look only along the corridors that leave the pencil. Never consult the solution.
function strokeTo(targetCell,from){if(targetCell===from)return [];
let hits=[],stopsAtFork=[];
for(let first of edges(from)){
 if(holes.includes(from)&&holes.includes(first))continue;
 let segment=[],prev=from,cell=first;
 for(let i=0;i<5;i++){
  if(cell===from||segment.includes(cell))break;
  segment.push(cell);
  if(cell===targetCell){hits.push(segment.slice());break}
  if(adj[from].length>2)break;
  // Gates and the burrow can hide exits. Count physical branches, not just allowed moves.
  if(holes.includes(cell)||stops.includes(cell)||cell===W*H-1)break;
  let onward=adj[cell].filter(x=>x!==prev);
  if(onward.length!==1){
   // A pointer aimed straight through a fork may approach it, but never cross it.
   let dx=cell%W-prev%W,dy=Math.floor(cell/W)-Math.floor(prev/W),tx=targetCell%W-cell%W,ty=Math.floor(targetCell/W)-Math.floor(cell/W);
   if(onward.length>1&&tx*dy===ty*dx&&tx*dx+ty*dy>0&&segment.length+Math.abs(tx)+Math.abs(ty)<=5){let offset=dx+dy*W,cursor=cell;while(cursor!==targetCell&&edges(cursor).includes(cursor+offset)&&!holes.includes(cursor))cursor+=offset;if(cursor===targetCell)stopsAtFork.push(segment.slice())}
   break
  }
  if(!edges(cell).includes(onward[0]))break;
  prev=cell;cell=onward[0];
 }
}
return hits.length===1?hits[0]:!hits.length&&stopsAtFork.length===1?stopsAtFork[0]:[]}
let hoverTarget=-1;
$('board').addEventListener('pointerleave',()=>hoverTarget=-1);
$('board').addEventListener('pointermove',e=>{if(!run||run.done||e.pointerType!=='mouse'||e.buttons>1)return;
 let svg=$('board').firstElementChild,q=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse()),x=Math.floor(q.x/20),y=Math.floor(q.y/20);
 if(x<0||x>=W||y<0||y>=H)return;
 let b=y*W+x;if(b===hoverTarget)return;hoverTarget=b;
 let segment=strokeTo(b,run.pos);for(let v of segment){move(v);if(run.done)break}
 if(segment.length&&!run.done&&adj[run.pos].length>2&&run.help!=='guided')$('status').textContent='Junction. Point along the passage you want.';
});

if(!restore(location.hash.slice(1)))generate();
</script></html>
