$('name').textContent={classic:'The winding paths',pattern:'The island passage',quest:'The treasure trail',tunnel:'Rabbit burrow',wind:'Windy Ridge'}[mode];$('folio').textContent='FIELD SHEET / '+code+'  ·  '+$('diff').value;$('mission').textContent=mode==='wind'?'You can go around a gate. To cross between its posts, follow the arrow.':mode==='tunnel'?'Find a rabbit hole, hop to its twin, then trace your way to the flag.':mode==='quest'?'Visit the numbered chests in order, then reach the flag.':mode==='pattern'?'Find a path around the shaded islands to the flag.':'Trace a path from the arrow to the flag.';$('extra').textContent=mode==='tunnel'?'◎  Twin rabbit holes':mode==='pattern'?'▨  Blocked island':mode==='quest'?'▣  Numbered chest':'';$('stats').textContent=W+' × '+H+' cells · '+adj.filter((v,i)=>v.length===1&&i!==0&&i!==n-1).length+' dead ends · '+route.slice(1).length+' solution steps';draw();toggle(false);leavePlay()}
function draw(){const s=20,X=i=>(i%W)*s,Y=i=>Math.floor(i/W)*s;let walls='',blocks='';
for(let i=0;i<W*H;i++){let x=X(i),y=Y(i);if(mask[i]){blocks+='M'+x+' '+y+'h20v20h-20z';continue}let v=adj[i];if(!v.includes(i-W))walls+='M'+x+' '+y+'h20';if(i!==0&&(x===0||!v.includes(i-1)))walls+='M'+x+' '+y+'v20';if(i!==W*H-1&&(x===(W-1)*s||mask[i+1]))walls+='M'+(x+s)+' '+y+'v20';if(y===(H-1)*s||mask[i+W])walls+='M'+x+' '+(y+s)+'h20'}
let endX=W*s,endY=H*s-10;
$('board').innerHTML='<svg class="map" role="img" aria-label="Maze with a start on the upper left and a finish on the lower right" viewBox="-18 -6 '+(endX+38)+' '+(H*s+18)+'"><defs><g id="windGate" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -9v3.5 M0 5.5V9" stroke-width="1.8"/><path class="gate-arrow" d="M-3.8 0H3.8 M.8 -2.8 3.8 0 .8 2.8"/></g><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse"><path d="M-1 1l2-2M0 5l5-5M4 6l2-2" stroke="#7d8779" stroke-width="1.4"/></pattern></defs><path d="'+blocks+'" fill="url(#hatch)"/><path class="wall" d="'+walls+'" fill="none" stroke="#254638" stroke-width="1.9" stroke-linecap="square"/><path class="solution route" d="M-5 10 '+route.map((i,k)=>(k&&holes.includes(i)&&holes.includes(route[k-1])?'M':'L')+(X(i)+10)+' '+(Y(i)+10)).join(' ')+' L'+(endX+4)+' '+endY+'" fill="none" stroke="#bd5638" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><g class="marker" fill="#a8432d"><path d="M-15 3l12 7-12 7z"/><path transform="translate('+(endX+6)+' '+(endY-7)+')" d="M0 0h12l-3 4 3 4H2v8H0z"/></g>'+stops.map((i,k)=>'<g transform="translate('+X(i)+' '+Y(i)+')"><rect x="2" y="3" width="16" height="14" rx="3" fill="#fff5cc" stroke="#493d21" stroke-width="1.4"/><path d="M2 8h16" stroke="#493d21"/><rect x="6" y="4" width="8" height="12" fill="#fff5cc"/><text x="10" y="14" text-anchor="middle" font-size="11" font-weight="bold">'+(k+1)+'</text></g>').join('')+gates.map(([a,b])=>'<g transform="translate('+((X(a)+X(b))/2+10)+' '+((Y(a)+Y(b))/2+10)+') rotate('+(b===a+1?0:b===a-1?180:b>a?90:-90)+')"><use href="#windGate"/></g>').join('')+holes.map(i=>'<g transform="translate('+X(i)+' '+Y(i)+')" fill="#faf6de" stroke="#483e2a" stroke-width="1.5"><ellipse cx="10" cy="13" rx="8" ry="5"/><ellipse cx="8" cy="8" rx="1.7" ry="4.4" transform="rotate(-13 8 8)"/><ellipse cx="12" cy="8" rx="1.7" ry="4.4" transform="rotate(13 12 8)"/></g>').join('')+'</svg>'}
function toggle(v){visible=v;$('board').classList.toggle('revealed',v);$('show').textContent=v?'Hide solution':'Show solution';$('show').setAttribute('aria-pressed',String(v))}
function printSheet(key){document.body.classList.toggle('key',key);$('printtitle').textContent=key?'Answer key':'Puzzle';window.print()}
window.addEventListener('afterprint',()=>{document.body.classList.remove('key');$('printtitle').textContent='Puzzle'});
$('printtitle').textContent='Puzzle';$('new').onclick=generate;$('show').onclick=()=>toggle(!visible);$('print').onclick=()=>printSheet(false);$('answer').onclick=()=>printSheet(true);document.querySelector('aside').onchange=e=>{if(e.target.id!=='code')generate()};$('code').oninput=e=>{e.target.value=e.target.value.toUpperCase();e.target.setCustomValidity('')};$('loadForm').onsubmit=e=>{e.preventDefault();if(!restore($('code').value)){$('code').setCustomValidity('Check the code printed on your sheet.');$('code').reportValidity()}};
for(let [id,fmt] of [['size',v=>v+' × '+Math.round(v*.64)],['complex',v=>levels[v]],['ends',v=>levels[v]],['chests',v=>v]])$(id).oninput=()=>$(id+'Val').value=fmt($(id).value);
const storeKey='maze-press:attempts:v1';
let run=null,saves={},canSave=true;
try{saves=JSON.parse(localStorage.getItem(storeKey)||'{}')||{}}catch{canSave=false}
function save(){saves[code]={...run,time:Date.now(),title:$('name').textContent,diff:$('diff').value};try{localStorage.setItem(storeKey,JSON.stringify(saves));canSave=true}catch{canSave=false}
$('savestate').textContent=(canSave?'Saved':'Session only')+' · '+run.moves+(run.moves===1?' move':' moves')+(stops.length?' · '+run.chests+'/'+stops.length+' chests':'')}
function leavePlay(){document.body.classList.remove('playing');run=null;$('console').hidden=true;$('play').textContent='Play maze';$('board').querySelector('.player-layer')?.remove()}
function edges(a){return adj[a].filter(b=>!gates.some(g=>g[1]===a&&g[0]===b))}
function target(){return stops[run.chests]??W*H-1}
function distance(goal){let d=new Int32Array(W*H).fill(-1),q=[goal];d[goal]=0;for(let i=0;i<q.length;i++)for(let b of adj[q[i]])if(d[b]<0&&edges(b).includes(q[i])){d[b]=d[q[i]]+1;q.push(b)}return d}
const pt=i=>[(i%W)*20+10,Math.floor(i/W)*20+10];
function paint(){let root=$('board').firstElementChild,layer=root.querySelector('.player-layer');if(!layer){layer=document.createElementNS(root.namespaceURI,'g');layer.setAttribute('class','player-layer');layer.innerHTML='<path id="trail" fill="none" stroke="#3a847a" stroke-opacity=".56" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g id="dot"><circle r="7.2" fill="#155951" stroke="#fff" stroke-width="1.5"/><path d="M-3 1q3 4 6 0" stroke="white" stroke-width="1.1" fill="none"/><path d="M-2.5-2h.1M2.5-2h.1" stroke="white" stroke-width="2" stroke-linecap="round"/></g>';root.append(layer)}
$('trail').setAttribute('d',run.trail.map((v,k)=>((!k||(holes.includes(v)&&holes.includes(run.trail[k-1])))?'M':'L')+pt(v).join(' ')).join(' '));let [x,y]=pt(run.pos);$('dot').style.transform='translate('+x+'px,'+y+'px)';$('hop').hidden=!holes.length;$('hop').disabled=!holes.includes(run.pos)||run.done;$('hint').disabled=run.done||run.help==='solo';$('pad').querySelectorAll('button').forEach(b=>b.disabled=run.done)}
function start(){document.body.classList.add('playing');hoverTarget=-1;toggle(false);let previous=saves[code];run=previous?{...previous,trail:[...previous.trail]}:{pos:0,moves:0,chests:0,trail:[0],done:false,help:'guided'};$('assist').value=run.help;$('console').hidden=false;$('play').textContent='Pause';$('status').textContent=run.done?'Maze complete!':previous?'Resumed your trail.':'Trace from the green dot.';paint();save();$('board').tabIndex=0;$('board').focus({preventScroll:true})}
function move(b){if(!run||run.done)return;let a=run.pos;if(!edges(a).includes(b)){$('status').textContent=adj[a].includes(b)?'The wind blows the other way.':'There is a wall there.';return}
let goal=target(),d=run.help==='guided'?distance(goal):null;run.pos=b;run.moves++;let back=run.trail.indexOf(b);if(back>=0)run.trail.length=back+1;else run.trail.push(b);
let msg=adj[b].length>2?'Fork! Pick the next square.':'Keep exploring.';if(d&&d[b]>d[a])msg='Try another way.';if(stops[run.chests]===b){run.chests++;msg='Chest '+run.chests+' found!'}if(holes.includes(b)&&!holes.includes(a))msg='Tap Hop to cross.';if(b===W*H-1){run.done=run.chests===stops.length;msg=run.done?'You reached the flag!':'Find chest '+(run.chests+1)+' first.'}
$('status').textContent=msg;paint();save()}
function step(k){if(!run)return;let a=run.pos, b=a+[-W,-1,W,1][k];if(holes.includes(a)&&holes.includes(b))return;move(b)}
$('play').onclick=()=>run?leavePlay():start();$('assist').onchange=()=>{run.help=$('assist').value;$('status').textContent=run.help==='guided'?'I’ll flag wrong turns.':run.help==='hint'?'Tap for a hint.':'Hints are off.';paint();save()};
$('hop').onclick=()=>{if(run&&holes.includes(run.pos))move(holes.find(i=>i!==run.pos))};
$('hint').onclick=()=>{if(!run||run.done||run.help==='solo')return;let d=distance(target()),b=edges(run.pos).find(i=>d[i]===d[run.pos]-1),delta=b-run.pos;$('status').textContent=holes.includes(b)&&holes.includes(run.pos)?'Hop through the burrow.':'Try one step '+({[-W]:'up',[-1]:'left',[W]:'down',[1]:'right'}[delta])+'.'};
$('pad').onclick=e=>{if(e.target.dataset.d!==undefined)step(+e.target.dataset.d)};document.addEventListener('keydown',e=>{if(!run||document.querySelector('dialog[open]')||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.altKey||e.ctrlKey||e.metaKey)return;let k=['ArrowUp','ArrowLeft','ArrowDown','ArrowRight'].indexOf(e.key);if(k>=0){e.preventDefault();step(k)}});
$('board').onclick=e=>{if(!run||e.pointerType==='touch'||e.pointerType==='pen'||e.sourceCapabilities?.firesTouchEvents)return;let svg=$('board').firstElementChild,q=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse()),x=Math.floor(q.x/20),y=Math.floor(q.y/20),b=y*W+x;if(x<0||x>=W||y<0||y>=H)return;if(b===run.pos&&holes.includes(b))$('hop').click();else if(Math.abs(x-run.pos%W)+Math.abs(y-Math.floor(run.pos/W))===1)move(b)};
$('library').onclick=()=>{let list=$('list');list.replaceChildren();let entries=Object.entries(saves).sort((a,b)=>b[1].time-a[1].time);if(!entries.length)list.textContent='No attempts yet. Choose Play maze to start one.';for(let [key,item] of entries){let button=document.createElement('button');button.textContent=item.title+' · '+item.diff+' · '+(item.done?'Complete':item.moves+' moves')+' · '+new Date(item.time).toLocaleDateString()+' · '+key;button.onclick=()=>{if(restore(key)){start();$('shelf').close()}};list.append(button)}$('shelf').showModal()};

// Look only along the corridors that leave the pencil. Never consult the solution.
function strokeTo(targetCell,from){if(targetCell===from)return [];
let hits=[],stopsAtFork=[];
for(let first of edges(from)){
 if(holes.includes(from)&&holes.includes(first))continue;
 let segment=[],prev=from,cell=first;
 for(let i=0;i<5;i++){
  if(cell===from||segment.includes(cell))break;
  segment.push(cell);
  if(cell===targetCell){hits.push(segment.slice());break}
  if(adj[from].length>2)break;
  // Gates and the burrow can hide exits. Count physical branches, not just allowed moves.
  if(holes.includes(cell)||stops.includes(cell)||cell===W*H-1)break;
  let onward=adj[cell].filter(x=>x!==prev);
  if(onward.length!==1){
   // A pointer aimed straight through a fork may approach it, but never cross it.
   let dx=cell%W-prev%W,dy=Math.floor(cell/W)-Math.floor(prev/W),tx=targetCell%W-cell%W,ty=Math.floor(targetCell/W)-Math.floor(cell/W);
   if(onward.length>1&&tx*dy===ty*dx&&tx*dx+ty*dy>0&&segment.length+Math.abs(tx)+Math.abs(ty)<=5){let offset=dx+dy*W,cursor=cell;while(cursor!==targetCell&&edges(cursor).includes(cursor+offset)&&!holes.includes(cursor))cursor+=offset;if(cursor===targetCell)stopsAtFork.push(segment.slice())}
   break
  }
  if(!edges(cell).includes(onward[0]))break;
  prev=cell;cell=onward[0];
 }
}
return hits.length===1?hits[0]:!hits.length&&stopsAtFork.length===1?stopsAtFork[0]:[]}
let hoverTarget=-1,contact=null;
const board=$('board');
function cellAt(e){const svg=board.firstElementChild,p=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse()),x=Math.floor(p.x/20),y=Math.floor(p.y/20);return x<0||y<0||x>=W||y>=H?-1:y*W+x}
board.addEventListener('pointerdown',e=>{if(!run||run.done||e.pointerType==='mouse'||!e.isPrimary)return;let b=cellAt(e);if(b<0)return;contact=e.pointerId;board.setPointerCapture(contact);hoverTarget=b;if(b!==run.pos&&edges(run.pos).includes(b)&&!(holes.includes(b)&&holes.includes(run.pos)))move(b)});
for(let type of ['pointerup','pointercancel','lostpointercapture'])board.addEventListener(type,e=>{if(e.pointerId===contact){contact=null;hoverTarget=-1}});
for(let [button,id] of [['settings','workshop'],['paper','printbox']])$(button).onclick=()=>$(id).showModal();
$('settingsDone').onclick=()=>$('workshop').close();
$('show').onclick=()=>{toggle(!visible);$('printbox').close()};
$('print').onclick=()=>{$('printbox').close();printSheet(false)};
$('answer').onclick=()=>{$('printbox').close();printSheet(true)};
$('board').addEventListener('pointerleave',()=>hoverTarget=-1);
$('board').addEventListener('pointermove',e=>{if(!run||run.done||(e.pointerType!=='mouse'&&e.pointerId!==contact)||e.buttons>1)return;
 let svg=$('board').firstElementChild,q=new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse()),x=Math.floor(q.x/20),y=Math.floor(q.y/20);
 if(x<0||x>=W||y<0||y>=H)return;
 let b=y*W+x;if(b===hoverTarget)return;hoverTarget=b;
 let segment=strokeTo(b,run.pos);for(let v of segment){move(v);if(run.done)break}
 if(segment.length&&!run.done&&adj[run.pos].length>2&&!holes.includes(run.pos)&&!stops.includes(run.pos))$('status').textContent='Fork! Pick the next square.';
});

if(!restore(location.hash.slice(1)))generate();
