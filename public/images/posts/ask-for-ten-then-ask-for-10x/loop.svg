<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#525252"/>
    </marker>
  </defs>
  <rect width="960" height="360" fill="#ffffff"/>

  <text x="20" y="36" font-size="20" font-weight="700" fill="#171717">Explore wide, build straight, then flip to evaluating</text>
  <text x="20" y="60" font-size="14" fill="#525252">Two exploration points, one straight line of implementation between them</text>

  <!-- phase bands -->
  <rect x="20" y="84" width="350" height="26" rx="4" fill="#dbeafe"/>
  <text x="195" y="102" font-size="13" font-weight="600" fill="#1e40af" text-anchor="middle">EXPLORE: you review options</text>
  <rect x="400" y="84" width="160" height="26" rx="4" fill="#f5f5f5"/>
  <text x="480" y="102" font-size="13" font-weight="600" fill="#404040" text-anchor="middle">BUILD</text>
  <rect x="590" y="84" width="350" height="26" rx="4" fill="#fef3c7"/>
  <text x="765" y="102" font-size="13" font-weight="600" fill="#92400e" text-anchor="middle">EVALUATE: the agent reviews itself</text>

  <!-- boxes -->
  <g font-size="15" fill="#171717">
    <rect x="20" y="126" width="160" height="128" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <text x="36" y="154" font-weight="700">1. Ask for ten</text>
    <text x="36" y="180" font-size="13" fill="#404040">Ten emails, or a set</text>
    <text x="36" y="198" font-size="13" fill="#404040">of mockups, each</text>
    <text x="36" y="216" font-size="13" fill="#404040">different in some way</text>

    <rect x="210" y="126" width="160" height="128" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
    <text x="226" y="154" font-weight="700">2. Mix and pick</text>
    <text x="226" y="180" font-size="13" fill="#404040">"Tone of #1, layout</text>
    <text x="226" y="198" font-size="13" fill="#404040">of #3, five more like</text>
    <text x="226" y="216" font-size="13" fill="#404040">that." Then choose.</text>

    <rect x="400" y="126" width="160" height="128" rx="8" fill="#ffffff" stroke="#a3a3a3" stroke-width="2"/>
    <text x="416" y="154" font-weight="700">3. Implement</text>
    <text x="416" y="180" font-size="13" fill="#404040">A straight line.</text>
    <text x="416" y="198" font-size="13" fill="#404040">May run in parallel,</text>
    <text x="416" y="216" font-size="13" fill="#404040">but no new choices</text>

    <rect x="590" y="126" width="160" height="128" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="606" y="154" font-weight="700">4. Run 10x</text>
    <text x="606" y="180" font-size="13" fill="#404040">Infer the goal, list</text>
    <text x="606" y="198" font-size="13" fill="#404040">the gaps, rank them,</text>
    <text x="606" y="216" font-size="13" fill="#404040">close all of them</text>

    <rect x="780" y="126" width="160" height="128" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="796" y="154" font-weight="700">5. Simplify</text>
    <text x="796" y="180" font-size="13" fill="#404040">Dial back what it</text>
    <text x="796" y="198" font-size="13" fill="#404040">overdid. Keep the</text>
    <text x="796" y="216" font-size="13" fill="#404040">interactivity</text>
  </g>

  <!-- arrows -->
  <g stroke="#525252" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M180 190H206"/>
    <path d="M370 190H396"/>
    <path d="M560 190H586"/>
    <path d="M750 190H776"/>
  </g>

  <!-- feedback note -->
  <path d="M860 254V300H480V258" stroke="#a3a3a3" stroke-width="2" stroke-dasharray="5 5" fill="none" marker-end="url(#a)"/>
  <text x="670" y="324" font-size="13" fill="#525252" text-anchor="middle">Then you are back to giving feedback, or to the next round</text>
</svg>
