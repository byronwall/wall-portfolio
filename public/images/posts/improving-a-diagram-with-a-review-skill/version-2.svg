<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Version two of the Vaultwarden update diagram</title>
  <desc id="desc">The eight Codex steps now sit inside four labeled phase bands. A large two-column header and ordinary connectors still make the graphic taller and harder to scan.</desc>
  <defs>
    <marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#51708c"/></marker>
    <marker id="green-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#397f79"/></marker>
    <marker id="amber-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#ae7540"/></marker>
  </defs>
  <rect width="1200" height="900" rx="22" fill="#ffffff"/>
  <rect width="1200" height="240" rx="22" fill="#f5f7fa"/>
  <path d="M0 218H1200" stroke="#d9e0e9"/>
  <text x="50" y="53" fill="#46536a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="2">SAME UPDATE, DIFFERENT PROCESS</text>
  <text x="50" y="104" fill="#152238" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="760">What I would have done.</text>
  <text x="50" y="151" fill="#152238" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="760">What Codex actually did.</text>
  <text x="685" y="105" fill="#46536a" font-family="Inter, Arial, sans-serif" font-size="20">I would have redeployed the container and</text>
  <text x="685" y="139" fill="#46536a" font-family="Inter, Arial, sans-serif" font-size="20">hoped it came back. Codex checked every</text>
  <text x="685" y="173" fill="#46536a" font-family="Inter, Arial, sans-serif" font-size="20">assumption before it touched the service.</text>

  <rect x="30" y="240" width="325" height="630" fill="#fffaf8" stroke="#d9e0e9"/>
  <circle cx="70" cy="284" r="20" fill="#f4dfd9"/>
  <path d="M62 276L78 292M78 276L62 292" stroke="#b35748" stroke-width="4"/>
  <text x="106" y="278" fill="#6b778c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.4">MY OLD PROCESS</text>
  <text x="106" y="307" fill="#152238" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="750">Redeploy and hope</text>
  <rect x="72" y="432" width="240" height="94" rx="9" fill="#fff" stroke="#d98f80"/>
  <text x="92" y="463" fill="#b35748" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">01</text>
  <text x="92" y="497" fill="#603f3a" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Redeploy the container</text>
  <path d="M192 527V590" stroke="#cb7767" stroke-width="1.5" stroke-dasharray="6 6" marker-end="url(#amber-arrow)"/>
  <rect x="72" y="596" width="240" height="94" rx="9" fill="#fff" stroke="#d98f80" stroke-dasharray="6 5"/>
  <text x="92" y="627" fill="#b35748" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">?</text>
  <text x="92" y="661" fill="#603f3a" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">Hope the vault comes back</text>

  <rect x="355" y="240" width="815" height="630" fill="#ffffff" stroke="#d9e0e9"/>
  <circle cx="397" cy="284" r="20" fill="#dcecea"/>
  <path d="M388 284L395 291L408 274" fill="none" stroke="#2f7d78" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="433" y="278" fill="#6b778c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.4">WHAT CODEX DID</text>
  <text x="433" y="307" fill="#152238" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="750">Check first, then update</text>
  <text x="397" y="341" fill="#46536a" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600">The running service does not change until step 6.</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="397" y="365" width="731" height="112" rx="10" fill="#f4f8fb" stroke="#b7c9d8"/>
    <text x="413" y="389" fill="#355a77" font-size="13" font-weight="750" letter-spacing="1.2">CHECK CURRENT STATE</text>
    <text x="1098" y="389" text-anchor="end" fill="#52627a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">1 of 4</text>
    <rect x="413" y="401" width="326" height="58" rx="7" fill="#fff" stroke="#b7c9d8"/>
    <text x="429" y="426" fill="#355a77" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">01</text>
    <text x="469" y="426" fill="#152238" font-size="15" font-weight="700">Find what is running</text>
    <text x="469" y="447" fill="#52627a" font-size="11.5">1.32.7 · persistent volume · healthy</text>
    <path d="M740 430H775" stroke="#51708c" stroke-width="2" marker-end="url(#blue-arrow)"/>
    <rect x="783" y="401" width="329" height="58" rx="7" fill="#fff" stroke="#b7c9d8"/>
    <text x="799" y="426" fill="#355a77" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">02</text>
    <text x="839" y="426" fill="#152238" font-size="15" font-weight="700">Find a compatible version</text>
    <text x="839" y="447" fill="#52627a" font-size="11.5">Target: 1.37.1</text>
    <path d="M762 478V491" stroke="#708198" stroke-width="2" marker-end="url(#blue-arrow)"/>

    <rect x="397" y="495" width="731" height="112" rx="10" fill="#f3faf8" stroke="#9fc9c3"/>
    <text x="413" y="519" fill="#2f7d78" font-size="13" font-weight="750" letter-spacing="1.2">PROVE THE BACKUP</text>
    <text x="1098" y="519" text-anchor="end" fill="#52627a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">2 of 4</text>
    <rect x="413" y="531" width="326" height="58" rx="7" fill="#fff" stroke="#9fc9c3"/>
    <text x="429" y="556" fill="#2f7d78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">03</text>
    <text x="469" y="556" fill="#152238" font-size="15" font-weight="700">Check the Restic snapshot</text>
    <text x="469" y="577" fill="#52627a" font-size="11.5">Database + WAL present</text>
    <path d="M740 560H775" stroke="#397f79" stroke-width="2" marker-end="url(#green-arrow)"/>
    <rect x="783" y="531" width="329" height="58" rx="7" fill="#fff" stroke="#9fc9c3"/>
    <text x="799" y="556" fill="#2f7d78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">04</text>
    <text x="839" y="556" fill="#152238" font-size="15" font-weight="700">Create a clean SQLite backup</text>
    <text x="839" y="577" fill="#52627a" font-size="11.5">Application-consistent copy</text>
    <path d="M762 608V621" stroke="#708198" stroke-width="2" marker-end="url(#blue-arrow)"/>

    <rect x="397" y="625" width="731" height="112" rx="10" fill="#fff9f2" stroke="#dfb578"/>
    <text x="413" y="649" fill="#a76b2d" font-size="13" font-weight="750" letter-spacing="1.2">DO THE UPDATE</text>
    <text x="1098" y="649" text-anchor="end" fill="#52627a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">3 of 4</text>
    <rect x="413" y="661" width="326" height="58" rx="7" fill="#fff" stroke="#dfb578"/>
    <text x="429" y="686" fill="#a76b2d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">05</text>
    <text x="469" y="686" fill="#152238" font-size="15" font-weight="700">Capture it off-server</text>
    <text x="469" y="707" fill="#52627a" font-size="11.5">Checksum saved and verified</text>
    <path d="M740 690H775" stroke="#ae7540" stroke-width="2" marker-end="url(#amber-arrow)"/>
    <rect x="783" y="661" width="329" height="58" rx="7" fill="#fff" stroke="#dfb578"/>
    <text x="799" y="686" fill="#a76b2d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">06</text>
    <text x="839" y="686" fill="#152238" font-size="15" font-weight="700">Pull and replace the container</text>
    <text x="839" y="707" fill="#52627a" font-size="11.5">First change to the service</text>
    <path d="M762 738V751" stroke="#708198" stroke-width="2" marker-end="url(#blue-arrow)"/>

    <rect x="397" y="755" width="731" height="96" rx="10" fill="#f4f8fb" stroke="#b7c9d8"/>
    <text x="413" y="779" fill="#355a77" font-size="13" font-weight="750" letter-spacing="1.2">CHECK THE RESULT</text>
    <text x="1098" y="779" text-anchor="end" fill="#52627a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">4 of 4</text>
    <rect x="413" y="791" width="326" height="46" rx="7" fill="#fff" stroke="#b7c9d8"/>
    <text x="429" y="820" fill="#355a77" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">07</text>
    <text x="469" y="820" fill="#152238" font-size="15" font-weight="700">Verify logs and health</text>
    <path d="M740 814H775" stroke="#51708c" stroke-width="2" marker-end="url(#blue-arrow)"/>
    <rect x="783" y="791" width="329" height="46" rx="7" fill="#fff" stroke="#9fc9c3"/>
    <text x="799" y="820" fill="#2f7d78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">08</text>
    <text x="839" y="820" fill="#152238" font-size="15" font-weight="700">Confirm 1.37.1 is live</text>
    <circle cx="1108" cy="791" r="16" fill="#2f7d78"/>
    <path d="M1100 791L1106 797L1116 784" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
