<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">A hopeful redeploy compared with a verified Vaultwarden update</title>
  <desc id="desc">What I would have done compared with what Codex actually did. The running service does not change until step six.</desc>
  <rect width="1200" height="760" fill="#f6f8fb"/>

  <text x="58" y="66" fill="#18263a" font-family="Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="-1.2">What I would have done. What Codex actually did.</text>
  <text x="58" y="98" fill="#4c5c70" font-family="Arial, sans-serif" font-size="13">I would have redeployed and hoped it came back. Codex checked every assumption before it touched the running service.</text>

  <rect x="40" y="136" width="337" height="584" rx="8" fill="#fffaf8" stroke="#ead7d2"/>
  <circle cx="80" cy="177" r="17" fill="#f5e4df"/>
  <text x="80" y="183" text-anchor="middle" fill="#a95145" font-family="Arial" font-size="19" font-weight="700">×</text>
  <text x="108" y="169" fill="#8a655f" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="1.3">MY OLD PROCESS</text>
  <text x="108" y="194" fill="#18263a" font-family="Arial" font-size="19" font-weight="700">Redeploy and hope</text>

  <rect x="84" y="294" width="248" height="77" rx="5" fill="#fff" stroke="#d8a69e"/>
  <text x="103" y="319" fill="#a95145" font-family="ui-monospace, monospace" font-size="10" font-weight="700">01</text>
  <text x="103" y="347" fill="#603b36" font-family="Arial" font-size="16" font-weight="700">Redeploy the container</text>
  <path d="M208 371v52" stroke="#b9786d" stroke-dasharray="5 5"/>
  <path d="m202 416 6 7 6-7" fill="none" stroke="#b9786d"/>
  <rect x="84" y="423" width="248" height="77" rx="5" fill="#fff" fill-opacity=".68" stroke="#d8a69e" stroke-dasharray="5 5"/>
  <text x="103" y="448" fill="#a95145" font-family="ui-monospace, monospace" font-size="10" font-weight="700">?</text>
  <text x="103" y="476" fill="#603b36" font-family="Arial" font-size="16" font-weight="700">Hope the vault comes back</text>
  <path d="M74 630H343" stroke="#ead7d2"/>
  <text x="74" y="658" fill="#603b36" font-family="Arial" font-size="10" font-weight="700" letter-spacing="1">CHECKS I SKIPPED</text>
  <text x="74" y="680" fill="#6b504b" font-family="Arial" font-size="11">Target version · restore proof · result check</text>

  <rect x="395" y="136" width="765" height="584" rx="8" fill="#fff" stroke="#e1e5eb"/>
  <circle cx="435" cy="177" r="17" fill="#dcebe7"/>
  <text x="435" y="183" text-anchor="middle" fill="#2e746f" font-family="Arial" font-size="17" font-weight="700">✓</text>
  <text x="463" y="169" fill="#68758a" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="1.3">WHAT CODEX DID</text>
  <text x="463" y="194" fill="#18263a" font-family="Arial" font-size="19" font-weight="700">Check first, then update</text>
  <text x="424" y="225" fill="#4d5d70" font-family="Arial" font-size="11">The running service does not change until step 6.</text>

  <!-- Inspect -->
  <g>
    <rect x="424" y="244" width="707" height="99" rx="6" fill="#f6f9fb" stroke="#cad6df"/>
    <text x="440" y="265" fill="#2f536c" font-family="Arial" font-size="10" font-weight="700" letter-spacing="1">CHECK CURRENT STATE</text>
    <text x="1099" y="265" text-anchor="end" fill="#4d5e73" font-family="ui-monospace, monospace" font-size="8">1 OF 4</text>
    <rect x="440" y="276" width="310" height="54" rx="4" fill="#fff" stroke="#becbd5"/>
    <text x="455" y="297" fill="#2f536c" font-family="ui-monospace, monospace" font-size="9" font-weight="700">01</text>
    <text x="485" y="298" fill="#18263a" font-family="Arial" font-size="13" font-weight="700">Find what is actually running</text>
    <text x="485" y="317" fill="#46576b" font-family="Arial" font-size="9.5">1.32.7 · volume · health</text>
    <path d="M750 303h52" stroke="#55788f" stroke-width="2"/><path d="m795 297 7 6-7 6" fill="none" stroke="#2f536c" stroke-width="2"/>
    <rect x="802" y="276" width="313" height="54" rx="4" fill="#fff" stroke="#becbd5"/>
    <text x="817" y="297" fill="#2f536c" font-family="ui-monospace, monospace" font-size="9" font-weight="700">02</text>
    <text x="847" y="298" fill="#18263a" font-family="Arial" font-size="13" font-weight="700">Find the compatible version</text>
    <text x="847" y="317" fill="#46576b" font-family="Arial" font-size="9.5">Compatible target: 1.37.1</text>
  </g>
  <circle cx="778" cy="351" r="8" fill="#fff" stroke="#7f98aa"/>
  <text x="778" y="355" text-anchor="middle" fill="#56758a" font-family="Arial" font-size="11" font-weight="700">↓</text>

  <!-- Prove rollback -->
  <g>
    <rect x="424" y="359" width="707" height="99" rx="6" fill="#f4faf8" stroke="#bfdad4"/>
    <text x="440" y="380" fill="#2e746f" font-family="Arial" font-size="10" font-weight="700" letter-spacing="1">PROVE THE BACKUP</text>
    <text x="1099" y="380" text-anchor="end" fill="#4d5e73" font-family="ui-monospace, monospace" font-size="8">2 OF 4</text>
    <rect x="440" y="391" width="310" height="54" rx="4" fill="#fff" stroke="#afd0c9"/>
    <text x="455" y="412" fill="#2e746f" font-family="ui-monospace, monospace" font-size="9" font-weight="700">03</text>
    <text x="485" y="413" fill="#18263a" font-family="Arial" font-size="13" font-weight="700">Check the Restic snapshot</text>
    <text x="485" y="432" fill="#46576b" font-family="Arial" font-size="9.5">Restic clean · database + WAL present</text>
    <path d="M750 418h52" stroke="#4d897f" stroke-width="2"/><path d="m795 412 7 6-7 6" fill="none" stroke="#2e746f" stroke-width="2"/>
    <rect x="802" y="391" width="313" height="54" rx="4" fill="#fff" stroke="#afd0c9"/>
    <text x="817" y="412" fill="#2e746f" font-family="ui-monospace, monospace" font-size="9" font-weight="700">04</text>
    <text x="847" y="413" fill="#18263a" font-family="Arial" font-size="13" font-weight="700">Create a clean SQLite backup</text>
    <text x="847" y="432" fill="#46576b" font-family="Arial" font-size="9.5">Application-consistent snapshot created</text>
  </g>
  <circle cx="778" cy="466" r="8" fill="#fff" stroke="#7f98aa"/>
  <text x="778" y="470" text-anchor="middle" fill="#56758a" font-family="Arial" font-size="11" font-weight="700">↓</text>

  <!-- Change -->
  <g>
    <rect x="424" y="474" width="707" height="99" rx="6" fill="#fcf8f1" stroke="#e2c394"/>
    <text x="440" y="495" fill="#a6703d" font-family="Arial" font-size="10" font-weight="700" letter-spacing="1">DO THE UPDATE</text>
    <text x="1099" y="495" text-anchor="end" fill="#4d5e73" font-family="ui-monospace, monospace" font-size="8">3 OF 4</text>
    <rect x="440" y="506" width="310" height="54" rx="4" fill="#fff" stroke="#d8b77f"/>
    <text x="455" y="527" fill="#a6703d" font-family="ui-monospace, monospace" font-size="9" font-weight="700">05</text>
    <text x="485" y="528" fill="#18263a" font-family="Arial" font-size="13" font-weight="700">Capture it off-server</text>
    <text x="485" y="547" fill="#46576b" font-family="Arial" font-size="9.5">Checksum saved · off-server copy verified</text>
    <path d="M750 533h52" stroke="#b38a53" stroke-width="2"/><path d="m795 527 7 6-7 6" fill="none" stroke="#a6703d" stroke-width="2"/>
    <rect x="802" y="506" width="313" height="54" rx="4" fill="#fff" stroke="#d8b77f"/>
    <text x="817" y="527" fill="#a6703d" font-family="ui-monospace, monospace" font-size="9" font-weight="700">06</text>
    <text x="847" y="528" fill="#18263a" font-family="Arial" font-size="13" font-weight="700">Pull and replace the container</text>
    <text x="847" y="547" fill="#46576b" font-family="Arial" font-size="9.5">The first change to the running service</text>
  </g>
  <circle cx="778" cy="581" r="8" fill="#fff" stroke="#7f98aa"/>
  <text x="778" y="585" text-anchor="middle" fill="#56758a" font-family="Arial" font-size="11" font-weight="700">↓</text>

  <!-- Verify -->
  <g>
    <rect x="424" y="589" width="707" height="99" rx="6" fill="#f1f9f7" stroke="#b4d3cd"/>
    <text x="440" y="610" fill="#2e746f" font-family="Arial" font-size="10" font-weight="700" letter-spacing="1">CHECK THE RESULT</text>
    <text x="1084" y="610" text-anchor="end" fill="#4d5e73" font-family="ui-monospace, monospace" font-size="8">4 OF 4</text>
    <circle cx="1103" cy="606" r="7" fill="#2e746f"/>
    <text x="1103" y="609" text-anchor="middle" fill="#fff" font-family="Arial" font-size="7" font-weight="700">✓</text>
    <rect x="440" y="621" width="310" height="54" rx="4" fill="#fff" stroke="#a9cbc4"/>
    <text x="455" y="642" fill="#2e746f" font-family="ui-monospace, monospace" font-size="9" font-weight="700">07</text>
    <text x="485" y="643" fill="#18263a" font-family="Arial" font-size="13" font-weight="700">Check version, logs, and endpoints</text>
    <text x="485" y="662" fill="#46576b" font-family="Arial" font-size="9.5">1.37.1 · clean startup · HTTP 200</text>
    <path d="M750 648h52" stroke="#4d897f" stroke-width="2"/><path d="m795 642 7 6-7 6" fill="none" stroke="#2e746f" stroke-width="2"/>
    <rect x="802" y="621" width="313" height="54" rx="4" fill="#fff" stroke="#a9cbc4"/>
    <text x="817" y="642" fill="#2e746f" font-family="ui-monospace, monospace" font-size="9" font-weight="700">08</text>
    <text x="847" y="643" fill="#18263a" font-family="Arial" font-size="13" font-weight="700">Open the iOS app</text>
    <text x="847" y="662" fill="#46576b" font-family="Arial" font-size="9.5">iOS works · rollback still available</text>
  </g>
</svg>
