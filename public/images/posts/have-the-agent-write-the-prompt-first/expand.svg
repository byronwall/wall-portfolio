<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#525252"/>
    </marker>
  </defs>
  <rect width="960" height="380" fill="#ffffff"/>

  <text x="20" y="36" font-size="20" font-weight="700" fill="#171717">Decompress the request before anyone builds it</text>
  <text x="20" y="60" font-size="14" fill="#525252">A thin request goes in. A full prompt comes out, and you read it before it runs</text>

  <!-- thin request -->
  <rect x="20" y="96" width="200" height="200" rx="8" fill="#ffffff" stroke="#a3a3a3" stroke-width="2"/>
  <text x="36" y="124" font-size="15" font-weight="700" fill="#171717">Thin request</text>
  <rect x="36" y="140" width="168" height="40" rx="6" fill="#f5f5f5"/>
  <text x="48" y="165" font-size="14" fill="#171717">"Make this denser."</text>
  <text x="36" y="210" font-size="13" fill="#404040">Given straight to an</text>
  <text x="36" y="228" font-size="13" fill="#404040">agent, this can become</text>
  <text x="36" y="246" font-size="13" fill="#404040">"padding 24px to 20px"</text>

  <!-- expand step -->
  <rect x="270" y="96" width="290" height="200" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="286" y="124" font-size="15" font-weight="700" fill="#171717">Ask for the prompt instead</text>
  <text x="286" y="148" font-size="13" fill="#404040">"Evaluate it, and write the prompt I</text>
  <text x="286" y="166" font-size="13" fill="#404040">could give an agent to make it happen."</text>
  <g font-size="13" fill="#1e3a8a">
    <rect x="286" y="182" width="258" height="98" rx="6" fill="#eff6ff"/>
    <text x="298" y="204">The prompt names the specific</text>
    <text x="298" y="222">changes, in words an agent can</text>
    <text x="298" y="240">act on. You see the model's reading</text>
    <text x="298" y="258">of "denser" before any code moves.</text>
  </g>

  <!-- three destinations -->
  <g font-size="14" fill="#171717">
    <rect x="610" y="96" width="330" height="56" rx="8" fill="#ffffff" stroke="#a3a3a3" stroke-width="2"/>
    <text x="626" y="120" font-weight="700">Same context</text>
    <text x="626" y="140" font-size="13" fill="#404040">Paste it right back: "go do it"</text>

    <rect x="610" y="168" width="330" height="56" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="626" y="192" font-weight="700">Clean context (most often)</text>
    <text x="626" y="212" font-size="13" fill="#404040">A fresh agent works only on that piece</text>

    <rect x="610" y="240" width="330" height="56" rx="8" fill="#ffffff" stroke="#a3a3a3" stroke-width="2"/>
    <text x="626" y="264" font-weight="700">Subagent or child session</text>
    <text x="626" y="284" font-size="13" fill="#404040">Runs it while the parent keeps going</text>
  </g>

  <g stroke="#525252" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M220 196H266"/>
    <path d="M560 196C585 196 585 124 606 124"/>
    <path d="M560 196H606"/>
    <path d="M560 196C585 196 585 268 606 268"/>
  </g>

  <text x="20" y="340" font-size="13" fill="#525252">For an LLM pipeline, the same two steps: expand (map configurations, inputs, best outputs),</text>
  <text x="20" y="360" font-size="13" fill="#525252">then write the prompt for a subagent that runs an eval and hill-climbs a metric.</text>
</svg>
