<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">explorEDA audit results</title>
  <desc id="desc">A comparison of the repository before and after an audit and repair loop.</desc>
  <rect width="1600" height="900" fill="#f6f4ee"/>
  <rect x="70" y="64" width="1460" height="772" rx="32" fill="#ffffff" stroke="#d9d4c8" stroke-width="3"/>
  <text x="130" y="150" fill="#171717" font-family="ui-sans-serif, system-ui, sans-serif" font-size="56" font-weight="700">One old repo. One repair loop.</text>
  <text x="130" y="205" fill="#68645d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="27">The build passed at the start. Almost every other signal said the repo was not ready.</text>

  <text x="130" y="300" fill="#9f3f32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700">AUDIT BASELINE</text>
  <text x="880" y="300" fill="#237352" font-family="ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700">AFTER THE LOOP</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="130" y="390" fill="#171717" font-size="64" font-weight="700">136</text>
    <text x="290" y="390" fill="#5d5952" font-size="28">TypeScript errors</text>
    <text x="880" y="390" fill="#237352" font-size="64" font-weight="700">0</text>
    <text x="950" y="390" fill="#5d5952" font-size="28">TypeScript errors</text>

    <text x="130" y="495" fill="#171717" font-size="64" font-weight="700">15</text>
    <text x="230" y="495" fill="#5d5952" font-size="28">failed tests, 22 TODO</text>
    <text x="880" y="495" fill="#237352" font-size="64" font-weight="700">118</text>
    <text x="1010" y="495" fill="#5d5952" font-size="28">passing tests</text>

    <text x="130" y="600" fill="#171717" font-size="64" font-weight="700">258</text>
    <text x="270" y="600" fill="#5d5952" font-size="28">lint warnings</text>
    <text x="880" y="600" fill="#237352" font-size="64" font-weight="700">0</text>
    <text x="950" y="600" fill="#5d5952" font-size="28">lint warnings</text>

    <text x="130" y="705" fill="#171717" font-size="64" font-weight="700">94</text>
    <text x="235" y="705" fill="#5d5952" font-size="28">runtime dependencies</text>
    <text x="880" y="705" fill="#237352" font-size="64" font-weight="700">46</text>
    <text x="990" y="705" fill="#5d5952" font-size="28">runtime dependencies</text>
  </g>

  <line x1="800" y1="275" x2="800" y2="735" stroke="#ddd8cd" stroke-width="2"/>
  <text x="130" y="790" fill="#68645d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">54 findings → 53 resolved + 1 documented false positive → 86 focused commits</text>
</svg>
